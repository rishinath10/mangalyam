<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Cormorant;font-weight:400;src:url(../../app/fonts/cormorant-garamond-latin-400-normal.woff2)}
@font-face{font-family:Cormorant;font-weight:400;font-style:italic;src:url(../../app/fonts/cormorant-garamond-latin-400-italic.woff2)}
@font-face{font-family:Jost;font-weight:400;src:url(../../app/fonts/jost-latin-400-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Jost,sans-serif;color:#F3E9D8;text-align:center;
  background:radial-gradient(330px 250px at 85% 8%,rgba(120,30,60,.55),transparent 70%),
    radial-gradient(330px 290px at 10% 100%,rgba(150,95,20,.28),transparent 70%),#190409;
  padding-top:44px;
}
.kick{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#C9A227;opacity:0;animation:up .7s ease .2s forwards}
h1{font-family:Cormorant,serif;font-weight:400;font-size:44px;line-height:1.02;margin-top:10px;opacity:0;animation:up .8s ease .6s forwards}
h1 em{display:block;font-style:italic;color:#EBD79B;font-size:50px;opacity:0;animation:up .9s ease 2.6s forwards}
.fan{position:relative;height:330px;margin-top:26px}
.fan img{position:absolute;top:50%;left:50%;width:132px;border-radius:17px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 26px 40px -18px rgba(0,0,0,.9);opacity:0}
.c0{animation:deal0 .9s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
.c1{width:150px!important;z-index:2;animation:deal1 .9s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
.c2{animation:deal2 .9s cubic-bezier(.2,.8,.2,1) 1.9s forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes deal0{from{opacity:0;transform:translate(-50%,-20%) rotate(0)}to{opacity:1;transform:translate(-50%,-50%) translateX(-64%) translateY(5%) rotate(-9deg)}}
@keyframes deal1{from{opacity:0;transform:translate(-50%,-20%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes deal2{from{opacity:0;transform:translate(-50%,-20%) rotate(0)}to{opacity:1;transform:translate(-50%,-50%) translateX(64%) translateY(5%) rotate(9deg)}}
.lede{font-size:15px;line-height:1.5;opacity:0;animation:up .8s ease 3.4s forwards;margin-top:22px;padding:0 34px}
</style>
</head>
<body>
<p class="kick">Our opening gift</p>
<h1>Free until <em>31 December 2026</em></h1>
<div class="fan">
  <img class="c0" src="covers/thamarai.png"><img class="c1" src="covers/kalyana-mandapam.png"><img class="c2" src="covers/neelam.png">
</div>
<p class="lede">Publish your invitation before then and it is yours to keep.</p>
</body>
</html>
